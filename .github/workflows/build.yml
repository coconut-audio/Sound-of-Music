name: Build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libasound2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package plugins
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          VST3=$(find build -name "Sound.of.Music.vst3" -type d | head -1)
          LV2=$(find build -name "Sound.of.Music.lv2" -type d | head -1)
          echo "VST3=$VST3 LV2=$LV2"
          tar cf Sound.of.Music.1-linux-vst3.tar -C "$(dirname "$VST3")" "$(basename "$VST3")"
          tar cf Sound.of.Music.1-linux-lv2.tar -C "$(dirname "$LV2")" "$(basename "$LV2")"

      - name: Upload artifacts
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Sound.of.Music.1-linux
          path: |
            Sound.of.Music.1-linux-vst3.tar
            Sound.of.Music.1-linux-lv2.tar

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Package plugins
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          VST3=$(find build -name "Sound.of.Music.vst3" -type d | head -1)
          LV2=$(find build -name "Sound.of.Music.lv2" -type d | head -1)
          echo "VST3=$VST3 LV2=$LV2"
          tar cf Sound.of.Music.1-windows-vst3.tar -C "$(dirname "$VST3")" "$(basename "$VST3")"
          tar cf Sound.of.Music.1-windows-lv2.tar -C "$(dirname "$LV2")" "$(basename "$LV2")"

      - name: Upload artifacts
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Sound.of.Music.1-windows
          path: |
            Sound.of.Music.1-windows-vst3.tar
            Sound.of.Music.1-windows-lv2.tar

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package plugins
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          VST3=$(find build -name "Sound.of.Music.vst3" -type d | head -1)
          AU=$(find build -name "Sound.of.Music.component" -type d | head -1)
          LV2=$(find build -name "Sound.of.Music.lv2" -type d | head -1)
          echo "VST3=$VST3 AU=$AU LV2=$LV2"
          tar cf Sound.of.Music.1-macos-vst3.tar -C "$(dirname "$VST3")" "$(basename "$VST3")"
          tar cf Sound.of.Music.1-macos-au.tar -C "$(dirname "$AU")" "$(basename "$AU")"
          tar cf Sound.of.Music.1-macos-lv2.tar -C "$(dirname "$LV2")" "$(basename "$LV2")"

      - name: Upload artifacts
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Sound.of.Music.1-macos
          path: |
            Sound.of.Music.1-macos-vst3.tar
            Sound.of.Music.1-macos-au.tar
            Sound.of.Music.1-macos-lv2.tar

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Sound of Music v1.0.0
          generate_release_notes: true
          files: |
            artifacts/Sound.of.Music.1-linux/*.tar
            artifacts/Sound.of.Music.1-windows/*.tar
            artifacts/Sound.of.Music.1-macos/*.tar
